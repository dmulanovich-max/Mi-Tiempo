<!doctype html><html lang=es><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name=apple-mobile-web-app-capable content=yes><link rel=manifest href=manifest.json><title>Mi Tiempo</title><style>
:root{--bg:#f5ead8;--paper:#fffaf1;--ink:#443a32;--muted:#81756a;--line:#e2d4c2;--nav:#8a6750}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}header{position:sticky;top:0;z-index:4;background:#f5ead8f5;padding:18px 16px 10px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:24px}.small{font-size:12px;color:var(--muted)}nav{display:flex;gap:8px;margin-top:12px}nav button{flex:1;border:0;border-radius:12px;padding:10px;background:#eadac5;font-weight:700;color:var(--ink)}nav .active{background:var(--nav);color:white}main{max-width:760px;margin:auto;padding:16px 16px 40px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}.title{display:block;font-weight:750;margin-bottom:8px}.total{font-size:22px;font-weight:800}.hidden{display:none}input[type=date],input[type=number],input[type=text],textarea{width:100%;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fffdf8}textarea{min-height:90px}.group{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px;background:#fffdf8}.head{padding:12px 14px;font-weight:800;display:flex;justify-content:space-between;align-items:center}.hours{width:92px!important;background:#ffffffdd!important}.acts{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:10px;background:white}.check input{width:19px;height:19px}.other{grid-column:1/-1}.save,.secondary{width:100%;padding:13px;border-radius:13px;font-weight:750}.save{border:0;background:var(--nav);color:white;font-size:17px}.secondary{border:1px solid var(--line);background:#fffdf8}.well{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.well button{border:1px solid var(--line);border-radius:10px;background:white;padding:10px 2px}.well .active{background:var(--nav);color:white}.status{text-align:center;color:var(--muted);font-size:13px;margin-top:8px}.calhead{display:flex;justify-content:space-between;align-items:center}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}.dow{text-align:center;font-size:12px;color:var(--muted)}.day{height:126px;border:1px solid var(--line);border-radius:11px;background:#fffdf8;padding:5px;text-align:center;overflow:hidden}.empty{visibility:hidden}.dots{display:flex;flex-direction:column;align-items:center;gap:3px;margin-top:5px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block}.daytotal{font-size:9px;color:var(--muted);margin-top:4px}.legend{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:14px;font-size:12px}.legend span{display:flex;align-items:center;gap:6px}.entry{padding:10px 0;border-bottom:1px solid var(--line)}@media(max-width:420px){.acts{grid-template-columns:1fr}.other{grid-column:1}.day{height:120px}}
</style></head><body><header><h1>Mi Tiempo</h1><div class=small>Un registro de cómo ocupo mis días</div><nav><button id=tH class=active>Hoy</button><button id=tC>Calendario</button><button id=tD>Datos</button></nav></header><main>
<section id=H><div class=card><label class=title>Fecha</label><input id=fecha type=date><div style="margin-top:13px"><span class=small>Total registrado hoy</span><div id=total class=total>0 h</div></div></div><div id=groups></div><div class=card><label class=title>Bienestar general</label><div class=small style="margin-bottom:8px">0 Muy bajo · 5 Muy bien</div><div id=well class=well></div></div><div class=card><label class=title>Comentarios del día</label><textarea id=comments placeholder="Cómo te sentiste, qué ocurrió, cómo te rindió el día..."></textarea></div><button id=save class=save>Guardar día</button><div id=status class=status></div></section>
<section id=C class=hidden><div class=card><div class=calhead><button id=prev class=secondary style="width:auto">←</button><strong id=month></strong><button id=next class=secondary style="width:auto">→</button></div><div id=cal class=calendar><div class=dow>L</div><div class=dow>M</div><div class=dow>X</div><div class=dow>J</div><div class=dow>V</div><div class=dow>S</div><div class=dow>D</div></div><div id=legend class=legend></div><p class=small>Cada color muestra un grupo registrado ese día. Toca el día para abrirlo.</p></div></section>
<section id=D class=hidden><div class=card><label class=title>Exportar</label><button id=export class=secondary>Exportar CSV</button></div><div class=card><label class=title>Registros guardados</label><div id=list></div></div></section></main><script>
const G=[{"id": "maitines", "name": "Maitines", "color": "#b9a6d8", "activities": ["Meditación", "Oración", "Escritura", "Dibujo", "Lectura"]}, {"id": "fisico", "name": "Físico", "color": "#9fd8bd", "activities": ["Caminata", "Surf", "Terapia", "Estiramientos", "Natación"]}, {"id": "lectura", "name": "Lectura", "color": "#9fd5e8", "activities": ["Visual", "Audiolibro"]}, {"id": "oficina", "name": "Oficina", "color": "#dc554f", "activities": ["Organización", "Cuentas SURFSITE", "Cuentas mías", "Galería Fórum", "Diseño"]}, {"id": "arte", "name": "Mi arte", "color": "#4ca66a", "activities": ["Investigación", "Proyecto", "Pintura", "Reparación"]}, {"id": "personal", "name": "Personal", "color": "#e2bc43", "activities": ["Amigos", "Familia", "MG", "Casa"]}, {"id": "hueveo", "name": "Hueveo", "color": "#c84d9c", "activities": []}, {"id": "calle", "name": "Calle", "color": "#4c78c2", "activities": ["Amigos", "Familia", "Compras", "Casa", "Expos", "Médicos"]}],KEY="miTiempo_v1",$=x=>document.getElementById(x);function today(){let d=new Date(),o=d.getTimezoneOffset();return new Date(d-o*60000).toISOString().slice(0,10)}function db(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch{return {}}}function store(x){localStorage.setItem(KEY,JSON.stringify(x))}
function build(){G.forEach(g=>{let w=document.createElement("div");w.className="group";w.innerHTML=`<div class=head style="background:${g.color}"><span>${g.name}</span><input class=hours id=h_${g.id} type=number min=0 max=24 step=.25 placeholder=horas></div><div class=acts id=a_${g.id}></div>`;$("groups").appendChild(w);let a=$("a_"+g.id);g.activities.forEach((n,i)=>a.insertAdjacentHTML("beforeend",`<label class=check><input id=c_${g.id}_${i} type=checkbox>${n}</label>`));a.insertAdjacentHTML("beforeend",`<div class=other><input id=o_${g.id} type=text placeholder="Otro (opcional)"></div>`);$("h_"+g.id).oninput=total});for(let i=0;i<=5;i++)$("well").insertAdjacentHTML("beforeend",`<button type=button data-v=${i} class="${i?"":"active"}">${i}</button>`);$("well").onclick=e=>{if(e.target.tagName!=="BUTTON")return;$("well").querySelectorAll("button").forEach(b=>b.classList.remove("active"));e.target.classList.add("active")};$("legend").innerHTML=G.map(g=>`<span><i class=dot style="background:${g.color}"></i>${g.name}</span>`).join("")}
function total(){let v=G.reduce((s,g)=>s+(parseFloat($("h_"+g.id).value)||0),0);$("total").textContent=Math.round(v*100)/100+" h";return v}function clear(){G.forEach(g=>{$("h_"+g.id).value="";g.activities.forEach((n,i)=>$("c_"+g.id+"_"+i).checked=false);$("o_"+g.id).value=""});$("well").querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.v==="0"));$("comments").value="";total()}
function form(){let groups={};G.forEach(g=>groups[g.id]={horas:parseFloat($("h_"+g.id).value)||0,actividades:g.activities.filter((n,i)=>$("c_"+g.id+"_"+i).checked),otro:$("o_"+g.id).value.trim()});return {fecha:$("fecha").value,grupos:groups,bienestar:+$("well").querySelector(".active").dataset.v,comentarios:$("comments").value.trim()}}
function load(f){clear();$("fecha").value=f;let r=db()[f];if(!r)return;G.forEach(g=>{let x=r.grupos?.[g.id]||{};$("h_"+g.id).value=x.horas||"";g.activities.forEach((n,i)=>$("c_"+g.id+"_"+i).checked=(x.actividades||[]).includes(n));$("o_"+g.id).value=x.otro||""});$("well").querySelectorAll("button").forEach(b=>b.classList.toggle("active",+b.dataset.v===+(r.bienestar??0)));$("comments").value=r.comentarios||"";total()}function save(){let r=form(),d=db();d[r.fecha]=r;store(d);$("status").textContent="Guardado ✓";setTimeout(()=>$("status").textContent="",1500)}
function show(v){["H","C","D"].forEach(x=>$(x).classList.toggle("hidden",x!==v));[["tH","H"],["tC","C"],["tD","D"]].forEach(([b,x])=>$(b).classList.toggle("active",x===v));if(v==="C")render();if(v==="D")list()}let cd=new Date();function render(){let y=cd.getFullYear(),m=cd.getMonth(),data=db();$("month").textContent=cd.toLocaleDateString("es-ES",{month:"long",year:"numeric"});let c=$("cal");[...c.querySelectorAll(".day")].forEach(e=>e.remove());let first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++){let e=document.createElement("div");e.className="day empty";c.appendChild(e)}for(let n=1;n<=days;n++){let iso=`${y}-${String(m+1).padStart(2,"0")}-${String(n).padStart(2,"0")}`,r=data[iso],dots="",tt=0;if(r)G.forEach(g=>{let x=r.grupos?.[g.id]||{},h=+x.horas||0;if(h>0||(x.actividades||[]).length||x.otro)dots+=`<i class=dot style="background:${g.color}"></i>`;tt+=h});let e=document.createElement("button");e.className="day";e.innerHTML=`<strong>${n}</strong><div class=dots>${dots}</div>${r?`<div class=daytotal>${Math.round(tt*100)/100} h</div>`:""}`;e.onclick=()=>{load(iso);show("H")};c.appendChild(e)}}
function list(){let rows=Object.values(db()).sort((a,b)=>b.fecha.localeCompare(a.fecha));$("list").innerHTML=rows.length?rows.map(r=>`<div class=entry><strong>${r.fecha}</strong> · ${Math.round(G.reduce((s,g)=>s+(+r.grupos?.[g.id]?.horas||0),0)*100)/100} h<div class=small>Bienestar ${r.bienestar??0}/5${r.comentarios?" · "+r.comentarios:""}</div></div>`).join(""):"<div class=small>Todavía no hay registros.</div>"}function esc(v){return '"'+String(v??"").replaceAll('"','""')+'"'}function exportCSV(){let h=["fecha","total_horas","bienestar","comentarios"];G.forEach(g=>h.push(g.name+"_horas",g.name+"_actividades",g.name+"_otro"));let rows=[h.map(esc).join(",")];Object.values(db()).sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(r=>{let tt=G.reduce((s,g)=>s+(+r.grupos?.[g.id]?.horas||0),0),v=[r.fecha,tt,r.bienestar??0,r.comentarios||""];G.forEach(g=>{let x=r.grupos?.[g.id]||{};v.push(x.horas||0,(x.actividades||[]).join(" | "),x.otro||"")});rows.push(v.map(esc).join(","))});let b=new Blob(["\ufeff"+rows.join("\n")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="mi_tiempo.csv";a.click()}
build();$("fecha").value=today();load(today());$("fecha").onchange=e=>load(e.target.value);$("save").onclick=save;$("tH").onclick=()=>show("H");$("tC").onclick=()=>show("C");$("tD").onclick=()=>show("D");$("prev").onclick=()=>{cd=new Date(cd.getFullYear(),cd.getMonth()-1,1);render()};$("next").onclick=()=>{cd=new Date(cd.getFullYear(),cd.getMonth()+1,1);render()};$("export").onclick=exportCSV;
</script></body></html>
