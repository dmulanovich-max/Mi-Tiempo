<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.json"><title>Mi Tiempo</title><style>
:root{--bg:#fff;--paper:#fff;--ink:#3f3b38;--muted:#827d78;--line:#e8e6e3;--active:#f3a467;--inactive:#f1f3f4}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}header{position:sticky;top:0;z-index:5;background:#fffffff5;padding:18px 16px 10px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:24px}.small{font-size:12px;color:var(--muted)}nav{display:flex;gap:8px;margin-top:12px}nav button{flex:1;border:0;border-radius:12px;padding:11px;background:var(--inactive);color:var(--ink);font-weight:700}nav button.active{background:var(--active);color:#332a24}main{max-width:760px;margin:auto;padding:16px 16px 44px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}.title{display:block;font-weight:750;margin-bottom:8px}.total{font-size:22px;font-weight:800}.hidden{display:none}input[type=date],input[type=text],textarea,select{width:100%;font-size:16px;padding:10px;border:1px solid #ddd9d5;border-radius:11px;background:white;color:var(--ink)}textarea{min-height:90px}.group{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:13px;background:white}.ghead{padding:11px 14px;font-weight:800}.row{display:grid;grid-template-columns:1fr 116px;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid #f0efed}.row:last-child{border-bottom:0}.row select{padding:8px;font-size:15px}.othername{padding:8px!important}.gtotal{display:flex;justify-content:space-between;padding:10px 13px;background:#fafafa;font-weight:750}.save,.secondary{width:100%;padding:13px;border-radius:13px;font-weight:750}.save{border:0;background:var(--active);color:#332a24;font-size:17px}.secondary{border:1px solid var(--line);background:white;color:var(--ink)}.well{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.well button{border:1px solid var(--line);border-radius:10px;background:white;padding:10px 2px}.well button.active{background:var(--active)}.status{text-align:center;color:var(--muted);font-size:13px;margin-top:8px}.calhead{display:flex;justify-content:space-between;align-items:center}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}.dow{text-align:center;font-size:12px;color:var(--muted)}.day{height:128px;border:1px solid var(--line);border-radius:10px;background:white;padding:5px;text-align:center;overflow:hidden;color:var(--ink)}.day.empty{visibility:hidden}.dots{display:flex;flex-direction:column;align-items:center;gap:3px;margin-top:5px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block}.daytotal{font-size:9px;color:var(--muted);margin-top:4px}.legend{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:14px;font-size:12px}.legend span{display:flex;gap:6px;align-items:center}.detail{margin-top:14px}.detailhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.dgroup{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:9px}.dgh{display:flex;justify-content:space-between;padding:8px 10px;font-weight:800}.drow{display:flex;justify-content:space-between;padding:7px 10px;border-top:1px solid #eee;font-size:14px}.entry{padding:10px 0;border-bottom:1px solid var(--line)}@media(max-width:420px){.day{height:120px}.row{grid-template-columns:1fr 105px}}
</style></head><body><header><h1>Mi Tiempo</h1><div class="small">Un registro de cómo ocupo mis días</div><nav><button id="tH" class="active">Hoy</button><button id="tC">Calendario</button><button id="tD">Datos</button></nav></header><main>
<section id="H"><div class="card"><label class="title">Fecha</label><input id="fecha" type="date"><div style="margin-top:13px"><span class="small">Total registrado hoy</span><div id="total" class="total">0 min</div></div></div><div id="groups"></div><div class="card"><label class="title">Bienestar general</label><div class="small" style="margin-bottom:8px">0 Muy bajo · 5 Muy bien</div><div id="well" class="well"></div></div><div class="card"><label class="title">Comentarios del día</label><textarea id="comments" placeholder="Cómo te sentiste, qué ocurrió, cómo te rindió el día..."></textarea></div><button id="save" class="save">Guardar día</button><div id="status" class="status"></div></section>
<section id="C" class="hidden"><div class="card"><div class="calhead"><button id="prev" class="secondary" style="width:auto">←</button><strong id="month"></strong><button id="next" class="secondary" style="width:auto">→</button></div><div id="cal" class="calendar"><div class="dow">L</div><div class="dow">M</div><div class="dow">X</div><div class="dow">J</div><div class="dow">V</div><div class="dow">S</div><div class="dow">D</div></div><div id="legend" class="legend"></div></div><div id="detail" class="card detail hidden"></div></section>
<section id="D" class="hidden"><div class="card"><label class="title">Exportar</label><p class="small">Descarga todos tus registros para abrirlos en Excel.</p><button id="export" class="secondary">Exportar CSV</button></div><div class="card"><label class="title">Registros guardados</label><div id="list"></div></div></section></main><script>
const G=[{"id": "maitines", "name": "Maitines", "color": "#b7a2df", "activities": ["Meditación", "Oración", "Escritura", "Dibujo", "Lectura"]}, {"id": "fisico", "name": "Físico", "color": "#9fd9bf", "activities": ["Caminata", "Surf", "Terapia", "Estiramientos", "Natación"]}, {"id": "lectura", "name": "Lectura", "color": "#9ecbf5", "activities": ["Visual", "Audiolibro"]}, {"id": "oficina", "name": "Oficina", "color": "#ef745f", "activities": ["Organización", "Cuentas SURFSITE", "Cuentas mías", "Galería Fórum", "Diseño"]}, {"id": "arte", "name": "Mi arte", "color": "#62b979", "activities": ["Investigación", "Proyecto", "Pintura", "Reparación"]}, {"id": "personal", "name": "Personal", "color": "#efc94f", "activities": ["Amigos", "Familia", "MG", "Casa"]}, {"id": "hueveo", "name": "Hueveo", "color": "#d95baa", "activities": []}, {"id": "calle", "name": "Calle", "color": "#5d88d5", "activities": ["Amigos", "Familia", "Compras", "Casa", "Expos", "Médicos"]}],KEY="miTiempo_v2",$=x=>document.getElementById(x);function fmt(m){m=+m||0;let h=Math.floor(m/60),r=m%60;return h?(h+" h"+(r?" "+r+" min":"")):(r?r+" min":"0 min")}function opts(){let s='<option value="0">—</option>';for(let m=15;m<=720;m+=15)s+=`<option value="${m}">${fmt(m)}</option>`;return s}function today(){let d=new Date(),o=d.getTimezoneOffset();return new Date(d-o*60000).toISOString().slice(0,10)}function db(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch{return {}}}function store(x){localStorage.setItem(KEY,JSON.stringify(x))}
function build(){G.forEach(g=>{let w=document.createElement("div");w.className="group";let rows=g.activities.map((n,i)=>`<div class=row><span>${n}</span><select id="m_${g.id}_${i}">${opts()}</select></div>`).join("");rows+=`<div class=row><input class=othername id="on_${g.id}" type=text placeholder="Otro (opcional)"><select id="om_${g.id}">${opts()}</select></div>`;w.innerHTML=`<div class=ghead style="background:${g.color}">${g.name}</div>${rows}<div class=gtotal><span>Total ${g.name}</span><span id="gt_${g.id}">0 min</span></div>`;$("groups").appendChild(w);w.querySelectorAll("select").forEach(s=>s.onchange=totals)});for(let i=0;i<=5;i++)$("well").insertAdjacentHTML("beforeend",`<button type=button data-v="${i}" class="${i?"":"active"}">${i}</button>`);$("well").onclick=e=>{if(e.target.tagName!=="BUTTON")return;$("well").querySelectorAll("button").forEach(b=>b.classList.remove("active"));e.target.classList.add("active")};$("legend").innerHTML=G.map(g=>`<span><i class=dot style="background:${g.color}"></i>${g.name}</span>`).join("")}
function groupMin(g){return g.activities.reduce((s,n,i)=>s+(+$("m_"+g.id+"_"+i).value||0),0)+(+$("om_"+g.id).value||0)}function totals(){let t=0;G.forEach(g=>{let m=groupMin(g);$("gt_"+g.id).textContent=fmt(m);t+=m});$("total").textContent=fmt(t);return t}
function clear(){G.forEach(g=>{g.activities.forEach((n,i)=>$("m_"+g.id+"_"+i).value=0);$("on_"+g.id).value="";$("om_"+g.id).value=0});$("well").querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.v==="0"));$("comments").value="";totals()}
function form(){let groups={};G.forEach(g=>groups[g.id]={actividades:g.activities.map((n,i)=>({nombre:n,minutos:+$("m_"+g.id+"_"+i).value||0})),otro:{nombre:$("on_"+g.id).value.trim(),minutos:+$("om_"+g.id).value||0}});return {fecha:$("fecha").value,grupos:groups,bienestar:+$("well").querySelector(".active").dataset.v,comentarios:$("comments").value.trim()}}
function load(f){clear();$("fecha").value=f;let r=db()[f];if(!r)return;G.forEach(g=>{let x=r.grupos?.[g.id]||{};g.activities.forEach((n,i)=>$("m_"+g.id+"_"+i).value=x.actividades?.[i]?.minutos||0);$("on_"+g.id).value=x.otro?.nombre||"";$("om_"+g.id).value=x.otro?.minutos||0});$("well").querySelectorAll("button").forEach(b=>b.classList.toggle("active",+b.dataset.v===+(r.bienestar??0)));$("comments").value=r.comentarios||"";totals()}function save(){let r=form(),d=db();d[r.fecha]=r;store(d);$("status").textContent="Guardado ✓";setTimeout(()=>$("status").textContent="",1500)}
function minsR(r,g){let x=r?.grupos?.[g.id];if(!x)return 0;return (x.actividades||[]).reduce((s,a)=>s+(+a.minutos||0),0)+(+x.otro?.minutos||0)}function show(v){["H","C","D"].forEach(x=>$(x).classList.toggle("hidden",x!==v));[["tH","H"],["tC","C"],["tD","D"]].forEach(([b,x])=>$(b).classList.toggle("active",x===v));if(v==="C")render();if(v==="D")list()}
let cd=new Date();function render(){let y=cd.getFullYear(),m=cd.getMonth(),data=db();$("month").textContent=cd.toLocaleDateString("es-ES",{month:"long",year:"numeric"});let c=$("cal");[...c.querySelectorAll(".day")].forEach(e=>e.remove());let first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++){let e=document.createElement("div");e.className="day empty";c.appendChild(e)}for(let n=1;n<=days;n++){let iso=`${y}-${String(m+1).padStart(2,"0")}-${String(n).padStart(2,"0")}`,r=data[iso],dots="",tt=0;if(r)G.forEach(g=>{let gm=minsR(r,g);if(gm>0)dots+=`<i class=dot style="background:${g.color}"></i>`;tt+=gm});let e=document.createElement("button");e.className="day";e.innerHTML=`<strong>${n}</strong><div class=dots>${dots}</div>${r?`<div class=daytotal>${fmt(tt)}</div>`:""}`;e.onclick=()=>detail(iso);c.appendChild(e)}}
function detail(f){let r=db()[f],d=$("detail");if(!r){d.classList.add("hidden");return}let total=G.reduce((s,g)=>s+minsR(r,g),0),date=new Date(f+"T12:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"});let html=`<div class=detailhead><div><strong>${date}</strong><div class=total>${fmt(total)}</div></div><button class=secondary style="width:auto" id=edit>Editar día</button></div>`;G.forEach(g=>{let gm=minsR(r,g);if(!gm)return;let x=r.grupos[g.id];html+=`<div class=dgroup><div class=dgh style="background:${g.color}"><span>${g.name}</span><span>${fmt(gm)}</span></div>`;(x.actividades||[]).filter(a=>+a.minutos>0).forEach(a=>html+=`<div class=drow><span>${a.nombre}</span><span>${fmt(a.minutos)}</span></div>`);if(+x.otro?.minutos>0)html+=`<div class=drow><span>${x.otro.nombre||"Otro"}</span><span>${fmt(x.otro.minutos)}</span></div>`;html+="</div>"});html+=`<div class=small>Bienestar: ${r.bienestar??0}/5${r.comentarios?`<br>Comentarios: ${r.comentarios}`:""}</div>`;d.innerHTML=html;d.classList.remove("hidden");$("edit").onclick=()=>{load(f);show("H")};d.scrollIntoView({behavior:"smooth",block:"start"})}
function list(){let rows=Object.values(db()).sort((a,b)=>b.fecha.localeCompare(a.fecha));$("list").innerHTML=rows.length?rows.map(r=>`<div class=entry><strong>${r.fecha}</strong> · ${fmt(G.reduce((s,g)=>s+minsR(r,g),0))}<div class=small>Bienestar ${r.bienestar??0}/5</div></div>`).join(""):"<div class=small>Todavía no hay registros.</div>"}function esc(v){return '"'+String(v??"").replaceAll('"','""')+'"'}function exportCSV(){let h=["fecha","total_minutos","bienestar","comentarios"];G.forEach(g=>g.activities.forEach(n=>h.push(g.name+"_"+n+"_minutos")));G.forEach(g=>h.push(g.name+"_Otro_nombre",g.name+"_Otro_minutos"));let rows=[h.map(esc).join(",")];Object.values(db()).sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(r=>{let v=[r.fecha,G.reduce((s,g)=>s+minsR(r,g),0),r.bienestar??0,r.comentarios||""];G.forEach(g=>{let x=r.grupos?.[g.id];g.activities.forEach((n,i)=>v.push(x?.actividades?.[i]?.minutos||0))});G.forEach(g=>{let x=r.grupos?.[g.id];v.push(x?.otro?.nombre||"",x?.otro?.minutos||0)});rows.push(v.map(esc).join(","))});let b=new Blob(["\ufeff"+rows.join("\n")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="mi_tiempo.csv";a.click()}
build();$("fecha").value=today();load(today());$("fecha").onchange=e=>load(e.target.value);$("save").onclick=save;$("tH").onclick=()=>show("H");$("tC").onclick=()=>show("C");$("tD").onclick=()=>show("D");$("prev").onclick=()=>{cd=new Date(cd.getFullYear(),cd.getMonth()-1,1);$("detail").classList.add("hidden");render()};$("next").onclick=()=>{cd=new Date(cd.getFullYear(),cd.getMonth()+1,1);$("detail").classList.add("hidden");render()};$("export").onclick=exportCSV;
</script></body></html>
